image: busybox:1.36
# Memory the process holds once started, in MiB.
holdMi: 40
resources:
  requests: {cpu: 100m, memory: 16Mi}
  limits: {memory: 128Mi}
# Recreate: a bad change replaces the healthy pod (the service goes down).
# RollingUpdate: the old pod keeps serving while the new one fails.
strategy: RollingUpdate
